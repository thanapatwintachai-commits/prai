<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="fw-bold mb-4">อัปโหลดข้อมูล & แดชบอร์ด</h2>
        
        <form action="/" method="POST" enctype="multipart/form-data" class="mb-4">
            <div class="mb-3">
                <input class="form-control" type="file" name="file" accept=".csv" required>
            </div>
            <button type="submit" class="btn btn-primary fw-bold">อัปโหลดและแสดงกราฟ</button>
        </form>

        <!-- พื้นที่สำหรับแสดงกราฟ -->
        {% if graphJSON %}
        <div class="card shadow-sm p-4 bg-white mb-4">
            <div id="chart"></div>
        </div>
        <script type="text/javascript">
            // แปลง string JSON เป็น JavaScript Object อย่างถูกต้อง
            var graphSpec = JSON.parse({{ graphJSON | tojson | safe }});
            Plotly.newPlot('chart', graphSpec.data, graphSpec.layout || {});
        </script>
        {% endif %}
    </div>
</body>
</html>
