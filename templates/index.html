<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้าง Histogram จากไฟล์ข้อมูล</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
    <style>
        :root {
            --bg: #f6f7f9;
            --surface: #ffffff;
            --text: #1b2430;
            --muted: #5d6b7c;
            --line: #d9dee5;
            --accent: #1f5fbf;
            --accent-dark: #174a97;
            --error-bg: #fdecec;
            --error-text: #a12626;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        main { max-width: 860px; margin: 0 auto; padding: 40px 20px 64px; }
        h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 4px; }
        .lead { color: var(--muted); margin: 0 0 24px; }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
        }
        .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
        .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 220px; min-width: 0; }
        label { font-size: 0.9rem; font-weight: 500; }
        input[type=file], select {
            font: inherit;
            padding: 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            width: 100%;
        }
        button {
            font: inherit;
            font-weight: 500;
            padding: 9px 20px;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }
        button:hover { background: var(--accent-dark); }
        button:disabled { opacity: .6; cursor: wait; }
        :focus-visible { outline: 3px solid #8ab4f8; outline-offset: 2px; }

        #message {
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 6px;
            background: var(--error-bg);
            color: var(--error-text);
        }
        #message[hidden] { display: none; }
        #result { margin-top: 24px; }
        #result[hidden] { display: none; }
        #meta { color: var(--muted); font-size: 0.9rem; margin: 0 0 8px; }
        #chart { width: 100%; min-height: 420px; }
    </style>
</head>
<body>
<main>
    <h1>สร้าง Histogram จากไฟล์ข้อมูล</h1>
    <p class="lead">เลือกไฟล์ .csv, .tsv หรือ .txt (ไม่เกิน 4 MB) แล้วเลือกคอลัมน์ที่ต้องการดูการกระจายของข้อมูล</p>

    <form id="upload-form" class="panel" novalidate>
        <div class="row">
